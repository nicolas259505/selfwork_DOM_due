<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selfwork_DOM_2</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Esercizio Creazione Articolo con DOM</h1>

    <div class="titolo">
        <input class="stile_titolo" type="text" id="titoloArticolo" placeholder="Inserisci qui il titolo dell'articolo">
    </div>

    <div class="area">
        <textarea class="casella" id="areaTesto" placeholder="Scrivi il contenuto dell'articolo qui"></textarea>
    </div>

    <div class="bott">
        <button class="btn" id="btnAggiungi">Crea Articolo</button>
    </div>

    <div id="spazio_vuoto">

    </div>
    


    <script src="main.js"></script>

</html>
